<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Informatics · Lesson 5 · IHSM</title>
<meta name="description" content="Computer Science for medical students, Lesson 5: good medical data in Excel — data table rules, Data Validation, cleaning, BMI formula, references. Slides, self-check and practical task.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Visual language of ism.edu.kg: light grey canvas, white rounded cards with soft shadows,
   graphite text, IHSM crimson for actions, pill-shaped buttons, SF-like type */
:root {
  --bg: #f5f5f7;
  --sheet: #ffffff;
  --ink: #1d1d1f;
  --muted: #6e6e73;
  --line: #d2d2d7;
  --accent: #aa2927;      /* IHSM crimson */
  --accent-ink: #ffffff;
  --accent-soft: #f8e9e8;
  --mark: #0066cc;        /* link blue */
  --mark-soft: #e8f1fb;
  --ok: #1d7a3a; --ok-soft: #e4f4e8;
  --bad: #c0392b; --bad-soft: #fbe7e5;
  --key: #f0f0f3; --key-edge: #c7c7cc;
  --hero: #1d1d1f;
  --shadow: 0 2px 12px rgb(0 0 0 / .07), 0 1px 2px rgb(0 0 0 / .04);
  --f-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r: 18px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --sheet: #1c1c1e; --ink: #f5f5f7; --muted: #a1a1a6; --line: #38383a;
  --accent: #e5534b; --accent-ink: #ffffff; --accent-soft: #3a1c1b; --mark: #4ea1ff; --mark-soft: #102a45;
  --ok: #5fd07c; --ok-soft: #12301b; --bad: #ff7b6e; --bad-soft: #3b1714; --key: #2c2c2e; --key-edge: #48484a;
  --hero: #1c1c1e; --shadow: 0 0 0 1px #2c2c2e;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #000000; --sheet: #1c1c1e; --ink: #f5f5f7; --muted: #a1a1a6; --line: #38383a;
  --accent: #e5534b; --accent-ink: #ffffff; --accent-soft: #3a1c1b; --mark: #4ea1ff; --mark-soft: #102a45;
  --ok: #5fd07c; --ok-soft: #12301b; --bad: #ff7b6e; --bad-soft: #3b1714; --key: #2c2c2e; --key-edge: #48484a;
  --hero: #1c1c1e; --shadow: 0 0 0 1px #2c2c2e;
  color-scheme: dark }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.55 var(--f-body); -webkit-font-smoothing: antialiased;
  padding-bottom: 48px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.12; letter-spacing: -0.02em; text-wrap: balance; margin: 0; font-weight: 700; }
p { margin: 0; }
a { color: var(--mark); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font: 600 12px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
kbd, .kbd { font: 700 14px/1 var(--f-mono); background: var(--key); border: 1px solid var(--key-edge); border-bottom-width: 3px; border-radius: 7px; padding: 4px 7px; display: inline-block; white-space: nowrap; }
code, .path { font-family: var(--f-mono); font-size: .88em; background: var(--key); padding: 2px 6px; border-radius: 6px; word-break: break-all; }

/* top bar — like the IHSM site navigation */
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--sheet) 88%, transparent); backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; justify-content: space-between; min-height: 64px; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; color: var(--ink); }
.crest { width: 40px; height: 40px; flex: none; }
.crest circle { fill: none; stroke: var(--accent); stroke-width: 2; }
.crest text { fill: var(--accent); font: 800 11px/1 var(--f-display); letter-spacing: .02em; }
.brand .school { font: 700 11px/1.25 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.brand .sep { width: 1px; align-self: stretch; background: var(--ink); opacity: .7; margin: 4px 2px; }
.brand h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.steps { display: flex; gap: 4px; list-style: none; padding: 0; margin: 0; flex-wrap: wrap; }
.steps[hidden] { display: none; }
.steps li { font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 999px; color: var(--muted); }
.steps li.done { color: var(--ok); }
.steps li.done::before { content: "✓ "; }
.steps li.now { background: var(--ink); color: var(--bg); }
.teacher-link { font-size: 14px; font-weight: 600; }

main { padding-top: 28px; }
.sheet { background: var(--sheet); border-radius: var(--r); box-shadow: var(--shadow); padding: clamp(20px, 4vw, 44px); }
.stack { display: grid; gap: 18px; }
.btn { border: 0; border-radius: 999px; padding: 12px 26px; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--accent-ink); transition: filter .15s, transform .15s; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(.98); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.note { font-size: 15px; color: var(--muted); }
.banner { border-radius: 14px; padding: 13px 16px; font-size: 15px; }
.banner.warn { background: var(--mark-soft); }
.banner.ok { background: var(--ok-soft); }
.banner.bad { background: var(--bad-soft); }
label.field { display: grid; gap: 6px; font-weight: 600; font-size: 15px; }
input[type=text], input[type=password], textarea, select { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; width: 100%; font-weight: 400; }
input:focus, textarea:focus, select:focus { border-color: var(--mark); outline: none; box-shadow: 0 0 0 3px var(--mark-soft); }
textarea { min-height: 96px; resize: vertical; }
.grid2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.check { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; background: var(--bg); border-radius: 12px; cursor: pointer; }
.check input { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }

/* hero on the start screen — like the IHSM homepage banner */
.hero { border-radius: var(--r); padding: clamp(28px, 6vw, 64px) clamp(20px, 5vw, 56px); color: #fff; text-align: center; display: grid; gap: 14px; justify-items: center;
  background: radial-gradient(120% 140% at 50% 0%, #b8302d 0%, #7d1d1b 55%, #3b0d0c 100%); }
.hero .eyebrow { color: rgb(255 255 255 / .8); }
.hero h2 { font-size: clamp(30px, 6vw, 56px); font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em; max-width: 18ch; }
.hero p { font-size: clamp(17px, 2.4vw, 24px); max-width: 40ch; opacity: .92; }
.hero .meta { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.hero .meta span { font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: rgb(255 255 255 / .14); }

/* slides */
.deck { display: grid; gap: 16px; }
.slide { background: var(--sheet); border-radius: var(--r); box-shadow: var(--shadow); padding: clamp(20px, 4vw, 48px); min-height: min(560px, 78vh); display: grid; align-content: start; gap: 20px; position: relative; overflow-wrap: anywhere; }
.slide .no { position: absolute; top: 18px; right: 22px; font: 600 13px/1 var(--f-mono); color: var(--muted); }
.slide h2 { font-size: clamp(28px, 4.4vw, 46px); font-weight: 700; max-width: 22ch; }
.slide .lead { font-size: clamp(18px, 2.2vw, 22px); color: var(--muted); max-width: 60ch; }
.slide ul { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }
.tiles { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.tile { background: var(--bg); border-radius: 14px; padding: 16px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.tile b { font-family: var(--f-display); font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
.tile .unit { font: 600 11px/1 var(--f-body); color: var(--accent); letter-spacing: .1em; text-transform: uppercase; }
.analogy { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.analogy .tile { border-top: 4px solid var(--accent); }
.analogy svg { width: 46px; height: 46px; }
.analogy svg * { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
table.ext { border-collapse: collapse; width: 100%; font-size: 16px; }
table.ext td, table.ext th { border-bottom: 1px solid var(--line); padding: 9px 6px; text-align: left; vertical-align: top; }
.tblwrap { overflow-x: auto; }
.tree { font: 500 15px/1.7 var(--f-mono); background: var(--bg); border-radius: 12px; padding: 14px 16px; white-space: pre; overflow-x: auto; }
.good { color: var(--ok); font-weight: 700; } .bad { color: var(--bad); font-weight: 700; }
.rule321 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.rule321 div { border-radius: 14px; padding: 16px; background: var(--accent-soft); display: grid; gap: 4px; }
.rule321 strong { font: 800 42px/1 var(--f-display); color: var(--accent); }
@media (max-width: 520px) { .rule321 { grid-template-columns: 1fr; } }
.keys { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.keyrow { display: flex; gap: 10px; align-items: center; background: var(--bg); border-radius: 12px; padding: 10px 12px; border: 1px solid transparent; }
.keyrow.hit { border-color: var(--ok); background: var(--ok-soft); }
.keyrow .combo { flex: none; display: flex; gap: 4px; }
.term { border: 0; background: none; padding: 0; color: inherit; font: inherit; font-weight: 600; border-bottom: 2px dotted var(--accent); cursor: help; }
.pop { position: fixed; z-index: 30; max-width: min(340px, calc(100vw - 32px)); background: var(--ink); color: var(--bg); border-radius: 14px; padding: 13px 15px; font-size: 15px; box-shadow: 0 12px 32px rgb(0 0 0 / .25); }
.pop b { display: block; margin-bottom: 4px; }
.deck-nav { display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots span.seen { background: color-mix(in srgb, var(--accent) 40%, var(--line)); } .dots span.cur { background: var(--accent); width: 22px; border-radius: 4px; }

/* quiz */
.q { background: var(--sheet); border: 0; border-radius: var(--r); box-shadow: var(--shadow); padding: 22px; display: grid; gap: 12px; margin: 0; min-width: 0; }
.q h3 { font-size: 19px; font-family: var(--f-body); font-weight: 600; letter-spacing: -0.01em; }
.q .num { font: 600 12px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; background: var(--bg); border: 1px solid transparent; border-radius: 12px; cursor: pointer; }
.opt input { margin-top: 5px; accent-color: var(--accent); flex: none; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.match { display: grid; gap: 8px; }
.match label { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 160px); gap: 10px; align-items: center; }
.explain { font-size: 15px; border-left: 3px solid var(--accent); padding-left: 12px; }
.score { font: 800 64px/1 var(--f-display); color: var(--accent); letter-spacing: -0.03em; }

/* practice + result card */
.task { display: grid; gap: 4px; }
.level { display: inline-block; font: 600 12px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); vertical-align: middle; }
.card { border: 2px dashed var(--accent); border-radius: var(--r); padding: 20px; display: grid; gap: 6px; }
details.faq summary { cursor: pointer; }
.grid2 > ul { align-content: start; }
figure.shot { margin: 0; display: grid; gap: 8px; }
figure.shot img { max-width: 100%; height: auto; border-radius: 12px; box-shadow: 0 0 0 1px var(--line), var(--shadow); background: #fff; justify-self: start; }
figure.shot figcaption { font-size: 14px; color: var(--muted); }
.card .code { font: 700 24px/1 var(--f-mono); letter-spacing: .14em; }

/* teacher */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 18px; background: var(--sheet); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); width: fit-content; max-width: 100%; }
.tabs button { border: 0; background: none; padding: 9px 16px; font-weight: 600; font-size: 15px; color: var(--muted); border-radius: 999px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--bg); background: var(--ink); }
.plan { display: grid; gap: 12px; }
.phase { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 16px; border-radius: 14px; padding: 18px; background: var(--sheet); box-shadow: var(--shadow); }
.phase.now { box-shadow: inset 4px 0 0 var(--accent), var(--shadow); }
.phase .t { font: 700 15px/1.3 var(--f-mono); color: var(--accent); }
.phase h3 { font-size: 18px; margin-bottom: 6px; }
.say { background: var(--accent-soft); border-radius: 12px; padding: 11px 14px; font-size: 16px; }
.say::before { content: "SAY: "; font: 700 12px/1 var(--f-body); letter-spacing: .1em; color: var(--accent); }
.tip { background: var(--mark-soft); border-radius: 12px; padding: 11px 14px; font-size: 15px; }
.tip::before { content: "Совет: "; font-weight: 700; color: var(--mark); }
.ask { box-shadow: inset 0 0 0 1px var(--accent); border-radius: 12px; padding: 11px 14px; font-size: 16px; }
.ask::before { content: "ASK: "; font: 700 12px/1 var(--f-body); letter-spacing: .1em; color: var(--accent); }
.presenter { display: grid; gap: 18px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 860px) { .presenter { grid-template-columns: 1fr; } .phase { grid-template-columns: 1fr; } }
.presenter .slide { min-height: 0; }
.notes { display: grid; gap: 12px; position: sticky; top: 84px; }
.clock { font: 700 30px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.stat { border-radius: 14px; padding: 16px; background: var(--sheet); box-shadow: var(--shadow); }
.stat b { display: block; font: 700 32px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
table.res { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
table.res th, table.res td { border-bottom: 1px solid var(--line); padding: 9px 8px; text-align: left; vertical-align: top; }
table.res th { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; min-width: 80px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar.low i { background: var(--bad); }
footer { margin-top: 40px; font-size: 13px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: no-preference) { .slide, .q, .sheet { animation: in .3s ease-out; } @keyframes in { from { transform: translateY(8px); opacity: .5; } to { transform: none; opacity: 1; } } }
@media print { .top, .deck-nav, .btn { display: none !important; } body { background: #fff; } .sheet, .slide, .q { box-shadow: none; border: 1px solid #ccc; } }

/* ---------- UX additions ---------- */
.home-link { font-size: 14px; font-weight: 600; color: var(--ink); }
.steps .of { display: none; }
figure.shot img { cursor: zoom-in; }
.lightbox { position: fixed; inset: 0; z-index: 50; background: rgb(0 0 0 / .86); display: grid; place-items: center; padding: 12px; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; background: #fff; }
.lightbox .x { position: fixed; top: 12px; right: 16px; color: #fff; font-size: 15px; font-weight: 600; }
@media (max-width: 900px) { .lightbox { display: block; overflow: auto; -webkit-overflow-scrolling: touch; padding: 48px 12px 12px; } .lightbox img { max-width: none; max-height: none; width: auto; } .lightbox .x { background: rgb(0 0 0 / .6); padding: 6px 12px; border-radius: 999px; } }
.qcount { position: sticky; top: 72px; z-index: 3; justify-self: end; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow); }
.qcount.all { background: var(--ok); color: #fff; }
.q.missing { box-shadow: 0 0 0 2px var(--bad), var(--shadow); }
#tSlideBox:fullscreen { background: var(--bg); padding: 4vh 5vw; overflow: auto; display: grid; align-content: center; }
#tSlideBox:fullscreen .slide { font-size: 1.25em; box-shadow: none; }
#tSlideBox:fullscreen .fs-hint { display: block; }
.fs-hint { display: none; position: fixed; bottom: 12px; right: 18px; font-size: 13px; color: var(--muted); }
@media (max-width: 700px) {
  .brand .school, .brand .sep, .crest { display: none; }
  .brand h1 { font-size: 15px; }
  .top .wrap { min-height: 52px; gap: 6px 12px; }
  .steps li:not(.now) { display: none; }
  .steps .of { display: inline; }
  .deck-nav { position: sticky; bottom: 0; z-index: 4; background: var(--bg); padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); margin: 0 -2px; }
  .deck-nav .dots { display: none; }
  .qcount { top: 60px; }
}
</style>
</head>

<header class="top">
  <div class="wrap">
    <a class="brand" href="../" aria-label="IHSM Informatics, Lesson 5">
      <svg class="crest" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18"/><text x="20" y="24" text-anchor="middle">IHSM</text></svg>
      <span class="school">International<br>Higher School<br>of Medicine</span>
      <span class="sep" aria-hidden="true"></span>
      <h1>Informatics · Lesson 5</h1>
    </a>
    <ol class="steps" id="steps" aria-label="Lesson steps"></ol>
    <a class="home-link" href="../">← All lessons</a>
    <a class="teacher-link" id="teacherLink" href="#teacher" hidden>Панель преподавателя</a>
  </div>
</header>

<main class="wrap" id="app"></main>
<footer class="wrap">Department of Natural Sciences Disciplines · Computer Science for medical students · Teacher: Zh. R. Sultanov</footer>
<div class="pop" id="pop" role="tooltip" hidden></div>

<script>
/* ======================= CONTENT ======================= */
const LESSON = { id: "L5", title: "Excel: Good Medical Data and Formulas", pass: 70 };
const SELF = ["I have entered data and simple formulas in Excel.", "I know the difference between relative and absolute references ($A$1).", "I have used Data Validation or a filter in Excel."];

const GLOSSARY = {
  cell: ["Cell and address", "A cell is where a column (letter) and a row (number) cross. Its address is, for example, B3. Русский: ячейка, адрес ячейки."],
  fbar: ["Formula bar", "The line above the sheet that shows the real content of the selected cell — a value or a formula. Русский: строка формул."],
  record: ["Row = observation", "In a data table one row describes one patient (one observation) and one column one variable. Русский: строка = наблюдение."],
  validation: ["Data Validation", "Rules that stop wrong values at the moment of entry, e.g. age only from 0 to 120 or a drop-down list. Русский: проверка данных."],
  filter: ["Filter", "Arrows in the header row that show the list of values of a column and let you show only some rows. Ctrl + Shift + L. Русский: фильтр."],
  clean: ["Data cleaning", "Finding and correcting typos, impossible values, duplicates and empty cells before analysis. Русский: очистка данных."],
  formula: ["Formula", "An expression that starts with = and calculates a value, e.g. =D2/(E2/100)^2. Русский: формула."],
  fill: ["Fill handle", "The small square at the bottom right of the selected cell. Drag it to copy a formula to other rows. Русский: маркер заполнения."],
  rel: ["Relative reference", "A reference like D2 that changes when the formula is copied (D2 → D3 → D4). Русский: относительная ссылка."],
  abs: ["Absolute reference", "A reference with $ like $J$1 that stays the same when copied. Press F4 to add $. Русский: абсолютная ссылка."],
  bmi: ["BMI", "Body mass index = weight (kg) / height (m)². Русский: индекс массы тела (ИМТ)."]
};
const T = (k, txt) => `<button type="button" class="term" data-term="${k}">${txt}</button>`;
const SHOT = (src, alt, cap) => `<figure class="shot"><img src="img/${src}" alt="${alt}" loading="lazy"><figcaption>${cap}</figcaption></figure>`;

function renderSteps(active) {
  const ol = document.getElementById("steps");
  ol.hidden = active < 0;
  ol.innerHTML = STEPS.map((s, i) => `<li class="${i < S.step ? "done" : ""} ${i === active ? "now" : ""}">${i + 1}<span class="of">/${STEPS.length}</span>. ${s}</li>`).join("");
}

function renderStudent() {
  renderSteps(S.step);
  [viewStart, viewSlides, viewQuiz, viewPractice, viewFinish][S.step]();
  window.scrollTo(0, 0);
}

  const go = d => { S.slide = Math.max(0, Math.min(SLIDES.length - 1, S.slide + d)); if (!S.seen.includes(S.slide)) S.seen.push(S.slide); save(); viewSlides(); window.scrollTo(0, 0); };
  const p = document.getElementById("prev"), n = document.getElementById("next"), q = document.getElementById("toQuiz");
  if (p) p.onclick = () => go(-1);
  if (n) n.onclick = () => go(1);
  if (q) q.onclick = () => { S.step = 2; save(); renderStudent(); };
  slideNav = go;
}
let slideNav = null;
document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (e.ctrlKey || e.metaKey) {
    const row = document.querySelector(`#keys .keyrow[data-k="${k}"]`);
    if (row) { row.classList.add("hit"); if (k === "s" || k === "f") e.preventDefault(); }
    return;
  }
  if (location.hash !== "#teacher" && S.step === 1 && slideNav && !/input|textarea|select/i.test(document.activeElement.tagName)) {
    if (e.key === "ArrowRight") slideNav(1);
    if (e.key === "ArrowLeft") slideNav(-1);
  }
});
let tx = null;
document.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", e => {
  if (tx === null || S.step !== 1 || location.hash === "#teacher" || !slideNav) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 70 && e.target.closest(".slide")) slideNav(dx < 0 ? 1 : -1);
}, { passive: true });

function isRight(q, a) {
  if (a === undefined) return false;
  if (q.type === "match") return Array.isArray(a) && q.answer.every((v, k) => Number(a[k]) === v);
  return Number(a) === q.answer;
}

function makeCode() { return codeFor(S.name, S.group, S.best || S.score); }
function codeFor(name, group, score) {
  const src = `${name}|${group}|${score}|${LESSON.id}`;
  let h = 0; for (const ch of src) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return (h.toString(36).toUpperCase() + "000000").slice(0, 6);
}

async function pushResult() {
  if (!S.name || ((!DB || !UID) && !SHEET_URL)) { SAVE_STATE = "offline"; return false; }
  const body = { lesson: LESSON.id, name: S.name.slice(0, 120), group: S.group.slice(0, 40), level: S.level, self: S.self,
    step: S.step, score: S.score, best: S.best || 0, attempts: S.attempts, answers: S.answers,
    practice: Object.keys(S.done).filter(k => S.done[k]), reflection: S.reflection.slice(0, 2000), submitted: S.submitted,
    code: S.code || makeCode(), updatedAt: new Date().toISOString() };
  if (DB && UID) {
    try { await DB.doc("results/" + UID).set(body); SAVE_STATE = "saved"; return true; }
    catch (e) { SAVE_STATE = "offline"; return false; }
  }
  try {
    const r = await fetch(SHEET_URL, { method: "POST", body: JSON.stringify(body) });
    const j = await r.json();
    if (j.error === "already submitted") { S.submitted = true; S.locked = true; save(); SAVE_STATE = "saved"; return true; }
    SAVE_STATE = j.ok ? "saved" : "offline"; return !!j.ok;
  } catch (e) { SAVE_STATE = "offline"; return false; }
}

let sheetRows = null, sheetErr = "";
async function loadSheet() {
  let key = ""; try { key = localStorage.getItem("inf-teacher-key") || ""; } catch (e) {}
  if (!key) { sheetErr = "nokey"; return; }
  try {
    const r = await fetch(SHEET_URL + "?lesson=" + LESSON.id + "&key=" + encodeURIComponent(key));
    const j = await r.json();
    if (!j.ok) { sheetErr = j.error || "error"; return; }
    /* one record per student: the latest row wins (duplicates in the sheet do not change the statistics) */
    const latest = new Map(), nk = r => (String(r.name) + "|" + String(r.group)).toLowerCase().replace(/\s+/g, " ").trim();
    for (const r of j.rows) { const k = nk(r), o = latest.get(k); if (!o || new Date(r.updatedAt) >= new Date(o.updatedAt)) latest.set(k, r); }
    sheetErr = ""; sheetRows = [...latest.values()]; results = sheetRows;
  } catch (e) { sheetErr = "network"; }
}

        </div>
        <div class="row"><button class="btn" id="cGo">Проверить</button><span id="cRes"></span></div></div></div>`;
    document.getElementById("cGo").onclick = () => {
      const v = id => document.getElementById(id).value.trim();
      const ok = codeFor(v("cName"), v("cGroup"), Number(v("cScore"))) === v("cCode").toUpperCase();
      const r = document.getElementById("cRes"); r.className = "pill " + (ok ? "ok" : "bad"); r.textContent = ok ? "Код верный" : "Код не совпадает";
    };
    return;
  }
  const groups = [...new Set(results.map(r => r.group).filter(Boolean))].sort();
  const rs = results.filter(r => !groupFilter || r.group === groupFilter);
  const tested = rs.filter(r => r.attempts > 0);
  const avg = tested.length ? Math.round(tested.reduce((a, r) => a + (r.best || 0), 0) / tested.length) : 0;
  const passed = tested.filter(r => (r.best || 0) >= LESSON.pass).length;
  const perQ = QUESTIONS.map((q, i) => {
    const withA = tested.filter(r => r.answers && r.answers[q.id] !== undefined);
    const ok = withA.filter(r => isRight(q, r.answers[q.id])).length;
    return { n: i + 1, q, pct: withA.length ? Math.round(100 * ok / withA.length) : null };
  });
  const hard = perQ.filter(x => x.pct !== null).sort((a, b) => a.pct - b.pct).slice(0, 3);
  b.innerHTML = `<div class="stack">
    <div class="row" style="align-items:end"><label class="field" for="gF" style="min-width:200px">Группа<select id="gF"><option value="">Все группы</option>${groups.map(g => `<option ${g === groupFilter ? "selected" : ""}>${esc(g)}</option>`).join("")}</select></label>${SHEET_URL && !DB ? `<button class="btn ghost" id="reload">Обновить</button><span class="note">Данные из вашей Google Таблицы</span>` : ""}</div>
    <div class="stats">
      <div class="stat"><span class="note">Начали урок</span><b>${rs.length}</b></div>
      <div class="stat"><span class="note">Прошли тест</span><b>${tested.length}</b></div>
      <div class="stat"><span class="note">Набрали ${LESSON.pass}%+</span><b>${passed}</b></div>
      <div class="stat"><span class="note">Средний лучший балл</span><b>${tested.length ? avg + "%" : "—"}</b></div>
    </div>
    ${hard.length ? `<div class="sheet stack"><p class="eyebrow">Разберите в начале пары</p>${hard.map(h => `<p><b>№${h.n}</b> — ${h.pct}% верно. ${esc(h.q.text)} <span class="note">(слайд ${h.q.slide})</span></p>`).join("")}</div>` : ""}
    <div class="sheet stack"><p class="eyebrow">Верные ответы по вопросам</p>
      <div class="tblwrap"><table class="res"><tr><th>№</th><th>Вопрос</th><th>Верно</th><th></th></tr>
      ${perQ.map(x => `<tr><td>${x.n}</td><td>${esc(x.q.text)}</td><td>${x.pct === null ? "—" : x.pct + "%"}</td><td><div class="bar ${x.pct !== null && x.pct < 60 ? "low" : ""}"><i style="width:${x.pct || 0}%"></i></div></td></tr>`).join("")}
      </table></div></div>
    <div class="sheet stack"><p class="eyebrow">Студенты</p>
      ${rs.length ? `<div class="tblwrap"><table class="res" id="resTable"><tr><th>Студент</th><th>Группа</th><th>Уровень</th><th>Этап</th><th>Лучший балл</th><th>Попытки</th><th>Практика</th><th>Что было трудно</th></tr></table></div>`
        : `<p class="note">Пока нет результатов. Они появятся здесь, когда студенты начнут урок по вашей ссылке.</p>`}
    </div>
  </div>`;
  document.getElementById("gF").onchange = e => { groupFilter = e.target.value; tResults(); };
  const rl = document.getElementById("reload"); if (rl) rl.onclick = () => { sheetRows = null; tResults(); };
  const tbl = document.getElementById("resTable");
  if (tbl) rs.slice().sort((a, b) => String(a.group).localeCompare(String(b.group), undefined, { numeric: true }) || String(a.name).localeCompare(String(b.name))).forEach(r => {
    const tr = document.createElement("tr");
    const cells = [r.name, r.group, r.level, STEPS[r.step] || "", r.attempts ? (r.best || 0) + "%" : "—", r.attempts || 0, (r.practice || []).length, r.reflection || ""];
    cells.forEach((v, k) => { const td = document.createElement("td"); if (k === 4 && r.attempts) { const s = document.createElement("span"); s.className = "pill " + ((r.best || 0) >= LESSON.pass ? "ok" : "bad"); s.textContent = v; td.append(s); } else td.textContent = v; tr.append(td); });
    tbl.append(tr);
  });
}

function tPractice() {
  const checks = PRACTICE_CHECKS;
  document.getElementById("tBody").innerHTML = `<div class="grid2">${["A", "B"].map(l => `<div class="sheet stack">
    <h3>Уровень ${l}</h3>
    ${PRACTICE[l].map((t, k) => `<div class="task"><p><b>${l}${k + 1}.</b> ${esc(t)}</p><p class="note">Проверить: ${checks[l][k]}</p></div>`).join("")}
  </div>`).join("")}</div>
  <p class="tip" style="margin-top:14px">Оценка практики — до 3 баллов: уровень A полностью — 2 балла, плюс 1 балл за 3 и более заданий уровня B или за помощь соседу.</p>`;
}

/* ======================= ROUTER + GLOSSARY ======================= */
function route() {
  if (location.hash === "#teacher") renderTeacher(); else renderStudent();
}
window.addEventListener("hashchange", route);

const pop = document.getElementById("pop");
document.addEventListener("click", e => {
  const t = e.target.closest(".term");
  if (!t) { pop.hidden = true; return; }
  const g = GLOSSARY[t.dataset.term]; if (!g) return;
  pop.innerHTML = `<b>${g[0]}</b>${g[1]}`;
  pop.hidden = false;
  const r = t.getBoundingClientRect();
  const w = Math.min(340, window.innerWidth - 32);
  pop.style.left = Math.max(16, Math.min(r.left, window.innerWidth - w - 16)) + "px";
  pop.style.top = (r.bottom + 8 + 160 > window.innerHeight ? Math.max(8, r.top - 8 - pop.offsetHeight) : r.bottom + 8) + "px";
});
document.addEventListener("keydown", e => { if (e.key === "Escape") pop.hidden = true; });


/* tap a screenshot to see it full size */
document.addEventListener("click", e => {
  const img = e.target.closest("figure.shot img");
  if (img) {
    const box = document.createElement("div");
    box.className = "lightbox";
    box.innerHTML = `<span class="x">✕ Close</span><img src="${img.src}" alt="${esc(img.alt)}">`;
    if (window.innerWidth <= 900) box.querySelector(".x").insertAdjacentHTML("afterend", `<p style="color:#fff;font-size:13px;margin:0 0 8px">Swipe to move the picture</p>`);
    box.onclick = () => box.remove();
    document.body.append(box);
    return;
  }
});
document.addEventListener("keydown", e => {
  const lb = document.querySelector(".lightbox");
  if (lb && e.key === "Escape") { lb.remove(); return; }
  /* projector mode: arrows change slides while the slide box is full screen */
  const box = document.getElementById("tSlideBox");
  if (box && document.fullscreenElement === box && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
    tSlide = Math.max(0, Math.min(SLIDES.length - 1, tSlide + (e.key === "ArrowRight" ? 1 : -1)));
    box.innerHTML = slideHTML(tSlide) + `<span class="fs-hint">← → slides · Esc exit</span>`;
  }
});
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && location.hash === "#teacher" && tTab === "slides") tSlides(); });

route();
</script>
